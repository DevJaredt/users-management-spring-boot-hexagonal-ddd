# =============================================
# Servicio
# =============================================
spring.application.name=notifiers-service
server.port=${PORT:8081}

# Health check para Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =============================================
# Kafka (Aiven en produccion, contenedor local en desarrollo)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notifiers-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:com.jcaa.notifiers.infrastructure.adapter.kafka.dto}
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.isolation.level=read_committed

# Seguridad del broker:
#   - Local: PLAINTEXT (contenedor Kafka de compose.yaml)
#   - Aiven: SSL con certificado de cliente (mTLS); los 3 PEM llegan por variables de entorno.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.ssl.key-store-type=${KAFKA_SSL_KEYSTORE_TYPE:PEM}
spring.kafka.ssl.key-store-key=${KAFKA_SSL_KEY:}
spring.kafka.ssl.key-store-certificate-chain=${KAFKA_SSL_CERT:}
spring.kafka.ssl.trust-store-type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.ssl.trust-store-certificates=${KAFKA_SSL_CA:}

# Topicos
kafka.topic.create-user=${KAFKA_TOPIC_CREATE_USER:create-user}
kafka.topic.update-user=${KAFKA_TOPIC_UPDATE_USER:update-user}
kafka.topic.create-account=${KAFKA_TOPIC_CREATE_ACCOUNT:create-account}
kafka.topic.notification-status=${KAFKA_TOPIC_NOTIFICATION_STATUS:notification-status}
kafka.topics.auto-create=${KAFKA_TOPICS_AUTO_CREATE:true}

# Productor: notifiers publica el resultado del envio en notification-status (paso 7)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# =============================================
# Relay SMTP de Brevo (smtp-relay.brevo.com)
#   Credenciales: Brevo -> SMTP & API -> SMTP
#     Login    -> BREVO_SMTP_USERNAME (formato beXXXXXXX@smtp-brevo.com)
#     Password -> BREVO_SMTP_PASSWORD (SMTP key, "Open SMTP key settings")
#   Puertos:
#     587 o 2525 -> STARTTLS
#     465        -> SSL (BREVO_SMTP_SSL=true, BREVO_SMTP_STARTTLS=false)
#   En el plan gratis de Render los puertos 25/465/587 estan bloqueados;
#   usa 2525 (BREVO_SMTP_PORT=2525) o sube a un plan pago.
# =============================================
brevo.smtp.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
brevo.smtp.port=${BREVO_SMTP_PORT:587}
brevo.smtp.auth=${BREVO_SMTP_AUTH:true}
brevo.smtp.starttls.enabled=${BREVO_SMTP_STARTTLS:true}
brevo.smtp.ssl.enabled=${BREVO_SMTP_SSL:false}
brevo.smtp.username=${BREVO_SMTP_USERNAME:}
brevo.smtp.password=${BREVO_SMTP_PASSWORD:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
brevo.timeout.connect=${BREVO_CONNECT_TIMEOUT:5s}
brevo.timeout.read=${BREVO_READ_TIMEOUT:10s}
brevo.timeout.write=${BREVO_WRITE_TIMEOUT:10s}
brevo.retry.max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry.initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry.multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-breaker.failure-rate-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-breaker.sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-breaker.minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-breaker.open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}
