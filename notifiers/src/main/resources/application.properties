# =============================================
# Servicio
# =============================================
spring.application.name=notifiers-service
server.port=${PORT:8081}

# Health check para Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =============================================
# Kafka (Aiven en produccion, contenedor local en desarrollo)
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notifiers-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:com.jcaa.notifiers.infrastructure.adapter.kafka.dto}
spring.kafka.consumer.properties.spring.json.value.default.type=com.jcaa.notifiers.infrastructure.adapter.kafka.dto.UserEventMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.isolation.level=read_committed

# Seguridad del broker (PLAINTEXT local, SASL_SSL en Aiven)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
spring.kafka.ssl.trust-store-type=${KAFKA_TRUSTSTORE_TYPE:PEM}

# Topicos
kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:user-events}
kafka.topic.notification-status=${KAFKA_TOPIC_NOTIFICATION_STATUS:notification-status}
kafka.topics.auto-create=${KAFKA_TOPICS_AUTO_CREATE:true}

# Productor: notifiers publica el resultado del envio en notification-status (paso 7)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# =============================================
# API transaccional de Brevo
# =============================================
brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.address=${BREVO_FROM_ADDRESS:}
brevo.from.name=${BREVO_FROM_NAME:Gestion de Usuarios}
brevo.timeout.connect=${BREVO_CONNECT_TIMEOUT:2s}
brevo.timeout.read=${BREVO_READ_TIMEOUT:5s}
brevo.retry.max-attempts=${BREVO_RETRY_MAX_ATTEMPTS:3}
brevo.retry.initial-delay=${BREVO_RETRY_INITIAL_DELAY:500ms}
brevo.retry.multiplier=${BREVO_RETRY_MULTIPLIER:2.0}
brevo.circuit-breaker.failure-rate-threshold=${BREVO_CIRCUIT_FAILURE_THRESHOLD:50}
brevo.circuit-breaker.sliding-window-size=${BREVO_CIRCUIT_WINDOW_SIZE:10}
brevo.circuit-breaker.minimum-calls=${BREVO_CIRCUIT_MINIMUM_CALLS:5}
brevo.circuit-breaker.open-duration=${BREVO_CIRCUIT_OPEN_DURATION:30s}
