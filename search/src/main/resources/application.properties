# =============================================
# Servicio
# =============================================
spring.application.name=search-service
server.port=${PORT:8083}

# Health check para Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# =============================================
# Kafka (Aiven en produccion, contenedor local en desarrollo)
# Consume los eventos que publica users (paso 2 del diagrama).
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:search-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:com.jcaa.search.infrastructure.adapter.kafka.dto}
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Seguridad del broker:
#   - Local: PLAINTEXT (contenedor Kafka de compose.yaml)
#   - Aiven: SSL con certificado de cliente (mTLS); los 3 PEM llegan por variables de entorno.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.ssl.key-store-type=${KAFKA_SSL_KEYSTORE_TYPE:PEM}
spring.kafka.ssl.key-store-key=${KAFKA_SSL_KEY:}
spring.kafka.ssl.key-store-certificate-chain=${KAFKA_SSL_CERT:}
spring.kafka.ssl.trust-store-type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.ssl.trust-store-certificates=${KAFKA_SSL_CA:}

# Topicos (los publica users)
kafka.topic.create-user=${KAFKA_TOPIC_CREATE_USER:create-user}
kafka.topic.update-user=${KAFKA_TOPIC_UPDATE_USER:update-user}
kafka.topic.delete-user=${KAFKA_TOPIC_DELETE_USER:delete-user}

# =============================================
# Guia 11 - OpenSearch en Aiven (CQRS: lectura desde el indice)
#   OPENSEARCH_ENABLED=false permite arrancar en local sin el servicio cloud.
#   OPENSEARCH_URL=https://host:15425
#   OPENSEARCH_USERNAME=avnadmin / OPENSEARCH_PASSWORD=...
# =============================================
opensearch.enabled=${OPENSEARCH_ENABLED:false}
opensearch.url=${OPENSEARCH_URL:}
opensearch.username=${OPENSEARCH_USERNAME:avnadmin}
opensearch.password=${OPENSEARCH_PASSWORD:}
opensearch.index=${OPENSEARCH_INDEX:users}
opensearch.connect-timeout=${OPENSEARCH_CONNECT_TIMEOUT:5s}
opensearch.read-timeout=${OPENSEARCH_READ_TIMEOUT:10s}
opensearch.search.default-size=${OPENSEARCH_DEFAULT_SIZE:20}
