# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Kafka: publicacion de eventos de usuario (paso 2 del diagrama)
# Aiven en produccion, contenedor local en desarrollo
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Seguridad del broker:
#   - Local: PLAINTEXT (contenedor Kafka de compose.yaml)
#   - Aiven: SSL con certificado de cliente (mTLS); los 3 PEM llegan por variables de entorno.
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.ssl.key-store-type=${KAFKA_SSL_KEYSTORE_TYPE:PEM}
spring.kafka.ssl.key-store-key=${KAFKA_SSL_KEY:}
spring.kafka.ssl.key-store-certificate-chain=${KAFKA_SSL_CERT:}
spring.kafka.ssl.trust-store-type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.ssl.trust-store-certificates=${KAFKA_SSL_CA:}

# Topicos que publica users (paso 2 del diagrama)
kafka.topic.create-user=${KAFKA_TOPIC_CREATE_USER:create-user}
kafka.topic.update-user=${KAFKA_TOPIC_UPDATE_USER:update-user}
# Evento de baja: lo consume el servicio search para retirar el documento del indice (Guia 11)
kafka.topic.delete-user=${KAFKA_TOPIC_DELETE_USER:delete-user}
kafka.topics.auto-create=${KAFKA_TOPICS_AUTO_CREATE:true}

# =============================================
# Guia 9 - Backblaze B2 (bucket privado compatible con S3)
#   B2_ENABLED=false permite arrancar en local sin credenciales cloud.
#   B2_KEY_ID           -> keyID de la Application Key
#   B2_APPLICATION_KEY  -> applicationKey de la Application Key
# =============================================
b2.enabled=${B2_ENABLED:false}
b2.endpoint=${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
b2.region=${B2_REGION:us-east-005}
b2.bucket=${B2_BUCKET:}
b2.key-id=${B2_KEY_ID:}
b2.application-key=${B2_APPLICATION_KEY:}
# 5 MB: limite del archivo por usuario (fotos o PDFs)
b2.max-file-size-bytes=${B2_MAX_FILE_SIZE_BYTES:5242880}
b2.connect-timeout=${B2_CONNECT_TIMEOUT:5s}
b2.read-timeout=${B2_READ_TIMEOUT:30s}

# Subida de archivos (multipart) alineada con el limite de B2
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:6MB}

# =============================================
# Guia 10 - Cache distribuida Valkey/Redis (Aiven)
#   CACHE_URI=rediss://default:password@host:puerto  (TLS obligatorio en Aiven)
#   CACHE_ENABLED=false permite arrancar en local sin cache.
# =============================================
cache.enabled=${CACHE_ENABLED:false}
cache.uri=${CACHE_URI:redis://localhost:6379}
cache.ttl-seconds=${CACHE_TTL_SECONDS:300}
cache.key-prefix=${CACHE_KEY_PREFIX:users:by-id:}
cache.connect-timeout=${CACHE_CONNECT_TIMEOUT:2s}

# =============================================
# Microservicio accounts (paso 5 del diagrama)
# =============================================
accounts.base-url=${ACCOUNTS_BASE_URL:http://localhost:8082}
accounts.timeout.connect=${ACCOUNTS_CONNECT_TIMEOUT:2s}
accounts.timeout.read=${ACCOUNTS_READ_TIMEOUT:5s}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
