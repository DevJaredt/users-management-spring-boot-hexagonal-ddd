# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource se configura manualmente con @Configuration
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Kafka: publicacion de eventos de usuario (paso 2 del diagrama)
# Aiven en produccion, contenedor local en desarrollo
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Seguridad del broker (PLAINTEXT local, SASL_SSL en Aiven)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.ssl.trust-store-location=${KAFKA_TRUSTSTORE_LOCATION:}
spring.kafka.ssl.trust-store-password=${KAFKA_TRUSTSTORE_PASSWORD:}
spring.kafka.ssl.trust-store-type=${KAFKA_TRUSTSTORE_TYPE:PEM}

kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:user-events}
kafka.topics.auto-create=${KAFKA_TOPICS_AUTO_CREATE:true}

# =============================================
# Microservicio accounts (paso 5 del diagrama)
# =============================================
accounts.base-url=${ACCOUNTS_BASE_URL:http://localhost:8082}
accounts.timeout.connect=${ACCOUNTS_CONNECT_TIMEOUT:2s}
accounts.timeout.read=${ACCOUNTS_READ_TIMEOUT:5s}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
