# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
# Railway (y la mayoria de PaaS) inyectan el puerto en la variable PORT.
# En local, si PORT no existe, se usa 8080.
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos MySQL
# =============================================
db.host=localhost
db.port=3306
db.name=crud_usuarios
db.username=root
db.password=1234567

# =============================================
# Proveedor de envio de correo
# javamail = SMTP clasico (requiere plan Pro en Railway)
# resend   = API HTTPS de Resend (funciona en todos los planes)
# =============================================
email.provider=${EMAIL_PROVIDER:javamail}

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=tu_correo@gmail.com
smtp.password=tu_app_password_aqui
smtp.from.address=tu_correo@gmail.com
smtp.from.name=Gestion de Usuarios

# Timeout (ms) de conexion/lectura/escritura SMTP.
# Sin este limite javax.mail espera indefinidamente y bloquea el hilo de envio.
smtp.timeout.millis=${SMTP_TIMEOUT_MILLIS:5000}

# =============================================
# Configuracion de Resend (API HTTPS)
# La API key se obtiene en https://resend.com/api-keys
# La direccion remitente debe pertenecer a un dominio verificado en Resend.
# =============================================
resend.api-key=${RESEND_API_KEY:}
resend.from.address=${RESEND_FROM_ADDRESS:onboarding@resend.dev}
resend.from.name=${RESEND_FROM_NAME:Gestion de Usuarios}
resend.base-url=https://api.resend.com
resend.timeout.millis=${RESEND_TIMEOUT_MILLIS:5000}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
